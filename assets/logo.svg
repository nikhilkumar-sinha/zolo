<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 50" width="260" height="50">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A27" />
      <stop offset="100%" stop-color="#1A3317" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>
  
  <g transform="translate(5, 5)">
    <!-- Elegant Crest Circle -->
    <circle cx="20" cy="20" r="19" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
    <circle cx="20" cy="20" r="16" fill="#1A3317" />
    
    <!-- Organic Leaf Monogram -->
    <path d="M16,24 C16,20 20,16 24,16 C24,20 20,24 16,24 Z M20,20 L24,24" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Logo Text -->
  <text x="55" y="27" font-family="'Playfair Display', 'Cinzel', serif" font-size="22" font-weight="900" fill="#1A3317" letter-spacing="1.5">ZOLO<tspan fill="#D4AF37">NOW</tspan></text>
  <text x="56" y="41" font-family="'Outfit', 'Inter', sans-serif" font-size="7.5" font-weight="600" fill="#D4AF37" letter-spacing="2.5" opacity="0.9">REGIONAL TREASURES</text>
</svg>
